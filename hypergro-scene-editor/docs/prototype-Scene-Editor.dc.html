<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
html,body{margin:0;height:100%;background:#f3f2ef;color:#1c1b19;font-family:'IBM Plex Sans',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#1c1b19}a:hover{color:#0b4ea2}
*{box-sizing:border-box}
input,button,textarea,select{font-family:inherit}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
</style>
</helmet>
<div onDragOver="{{ onDragOver }}" onDragLeave="{{ onDragLeave }}" onDrop="{{ onDrop }}" style="display:flex;flex-direction:column;height:100vh;min-height:480px;overflow:hidden;background:#f3f2ef;outline:{{ dropOutline }};outline-offset:-3px">
  <div style="display:flex;align-items:center;gap:14px;padding:10px 20px;min-height:52px;border-bottom:1px solid #dedcd6;background:#fbfaf8;flex-shrink:0;flex-wrap:wrap;row-gap:8px">
    <div style="font-weight:600;font-size:14px;letter-spacing:.01em;white-space:nowrap">Hypergro · Scene Editor</div>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6b6a66;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="{{ fileName }}">{{ fileName }}</div>
    <div style="flex:1"></div>
    <a href="scene-format.md" style="font-size:12px;color:#6b6a66;text-decoration:none;white-space:nowrap">Scene format</a>
    <a href="illustrator/Export Hypergro Scene.jsx" download="Export Hypergro Scene.jsx" style="font-size:12px;color:#0b4ea2;text-decoration:none;white-space:nowrap">Illustrator exporter ↓</a>
    <div style="display:flex;gap:6px">
      <label style="display:flex;align-items:center;height:32px;padding:0 12px;border:1px solid #cfcdc6;border-radius:6px;font-size:13px;cursor:pointer;background:#fff;white-space:nowrap" style-hover="border-color:#1c1b19">Open scene folder<input type="file" webkitdirectory="" multiple="" onChange="{{ onPickFolder }}" style="display:none"></label>
      <label style="display:flex;align-items:center;height:32px;padding:0 12px;border:1px solid #cfcdc6;border-radius:6px;font-size:13px;cursor:pointer;background:#fff;white-space:nowrap" style-hover="border-color:#1c1b19">.zip<input type="file" accept=".zip,application/zip" onChange="{{ onPickZip }}" style="display:none"></label>
    </div>
    <div style="width:1px;height:20px;background:#dedcd6"></div>
    <div style="display:flex;gap:6px">
      <button onClick="{{ exportPNG }}" style="height:32px;padding:0 12px;border:1px solid #cfcdc6;border-radius:6px;background:#fff;font-size:13px;cursor:pointer" style-hover="border-color:#1c1b19">PNG</button>
      <button onClick="{{ exportPDF }}" style="height:32px;padding:0 12px;border:1px solid #cfcdc6;border-radius:6px;background:#fff;font-size:13px;cursor:pointer" style-hover="border-color:#1c1b19">PDF</button>
      <button onClick="{{ exportSVG }}" style="height:32px;padding:0 12px;border:1px solid #cfcdc6;border-radius:6px;background:#fff;font-size:13px;cursor:pointer" style-hover="border-color:#1c1b19">SVG</button>
      <button onClick="{{ exportScene }}" style="height:32px;padding:0 12px;border:1px solid #cfcdc6;border-radius:6px;background:#fff;font-size:13px;cursor:pointer" style-hover="border-color:#1c1b19">scene.json</button>
      <button onClick="{{ exportAll }}" style="height:32px;padding:0 14px;border:none;border-radius:6px;background:#1c1b19;color:#fff;font-size:13px;font-weight:500;cursor:pointer" style-hover="background:#0b4ea2">Export all sizes</button>
    </div>
  </div>

  <div style="display:flex;flex:1;min-height:0">
    <div style="flex:1;display:flex;flex-direction:column;min-width:0">
      <div style="display:flex;align-items:center;gap:4px;padding:10px 20px;flex-shrink:0;flex-wrap:wrap;row-gap:8px">
        <sc-for list="{{ sizes }}" as="s" hint-placeholder-count="4">
          <button onClick="{{ s.pick }}" title="{{ s.title }}" style="height:28px;padding:0 10px;border-radius:5px;border:1px solid transparent;background:{{ s.bg }};color:{{ s.fg }};font-family:'IBM Plex Mono',monospace;font-size:12px;cursor:pointer">{{ s.label }}</button>
        </sc-for>
        <div style="width:1px;height:18px;background:#dedcd6;margin:0 6px"></div>
        <button onClick="{{ undo }}" disabled="{{ noUndo }}" title="Undo (⌘Z)" style="height:28px;padding:0 10px;border:1px solid #cfcdc6;border-radius:6px;background:#fff;font-size:12px;cursor:pointer;opacity:{{ undoOp }}">Undo</button>
        <button onClick="{{ redo }}" disabled="{{ noRedo }}" title="Redo (⇧⌘Z)" style="height:28px;padding:0 10px;border:1px solid #cfcdc6;border-radius:6px;background:#fff;font-size:12px;cursor:pointer;opacity:{{ redoOp }}">Redo</button>
        <div style="flex:1"></div>
        <div style="display:flex;align-items:center;border:1px solid #cfcdc6;border-radius:6px;overflow:hidden;background:#fff;margin-right:10px;flex-shrink:0;white-space:nowrap">
          <button onClick="{{ zoomOut }}" title="Zoom out" style="height:28px;width:28px;border:none;background:#fff;font-size:14px;cursor:pointer">−</button>
          <button onClick="{{ zoomReset }}" title="Actual size" style="height:28px;min-width:52px;border:none;border-left:1px solid #dedcd6;border-right:1px solid #dedcd6;background:#fff;font-family:'IBM Plex Mono',monospace;font-size:12px;cursor:pointer">{{ zoomLabel }}</button>
          <button onClick="{{ zoomIn }}" title="Zoom in" style="height:28px;width:28px;border:none;background:#fff;font-size:14px;cursor:pointer">+</button>
          <button onClick="{{ zoomFit }}" title="Fit to screen" style="height:28px;padding:0 10px;border:none;border-left:1px solid #dedcd6;background:{{ fitBg }};color:{{ fitFg }};font-size:12px;cursor:pointer">Fit</button>
        </div>
        <div style="display:flex;border:1px solid #cfcdc6;border-radius:6px;overflow:hidden;background:#fff;flex-shrink:0;white-space:nowrap">
          <button onClick="{{ modeSelect }}" style="height:28px;padding:0 12px;border:none;background:{{ selModeBg }};color:{{ selModeFg }};font-size:12px;cursor:pointer">Select</button>
          <button onClick="{{ modeComment }}" style="height:28px;padding:0 12px;border:none;border-left:1px solid #cfcdc6;background:{{ comModeBg }};color:{{ comModeFg }};font-size:12px;cursor:pointer">Comment</button>
        </div>
      </div>

      <div ref="{{ stageRef }}" onMouseDown="{{ onStageDown }}" style="flex:1;min-height:0;display:grid;place-items:center;overflow:auto;background-image:radial-gradient(#d9d7d0 1px,transparent 1px);background-size:16px 16px">
        <div style="width:{{ scaledW }}px;height:{{ scaledH }}px;margin:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center">
        <div ref="{{ artRef }}" style="position:relative;width:{{ cw }}px;height:{{ ch }}px;transform:scale({{ zoom }});transform-origin:center;box-shadow:0 1px 0 #cfcdc6,0 12px 32px rgba(28,27,25,.12);background:#fff;overflow:hidden;flex-shrink:0;cursor:default">
          <sc-for list="{{ els }}" as="e" hint-placeholder-count="0">
            <div onMouseDown="{{ e.down }}" onMouseEnter="{{ e.enter }}" onMouseLeave="{{ e.leave }}" title="{{ e.title }}" style="position:absolute;left:{{ e.left }}px;top:{{ e.top }}px;width:{{ e.width }}px;height:{{ e.height }}px;display:{{ e.display }};align-items:{{ e.alignItems }};justify-content:{{ e.justify }};z-index:{{ e.z }};transform:rotate({{ e.rot }}deg);opacity:{{ e.opacity }};color:{{ e.color }};font-size:{{ e.fs }}px;font-weight:{{ e.weight }};font-style:{{ e.fstyle }};font-family:{{ e.font }};line-height:{{ e.lh }};letter-spacing:{{ e.ls }}px;text-align:{{ e.align }};white-space:{{ e.ws }};background-color:{{ e.bg }};background-image:{{ e.bgImg }};background-size:100% 100%;background-repeat:no-repeat;border-radius:{{ e.radius }}px;outline:{{ e.outline }};outline-offset:2px;cursor:{{ e.cursor }};user-select:none;text-wrap:pretty">{{ e.text }}</div>
          </sc-for>
          <sc-for list="{{ pins }}" as="p" hint-placeholder-count="0">
            <div onMouseDown="{{ p.open }}" title="{{ p.text }}" style="position:absolute;left:{{ p.left }}px;top:{{ p.top }}px;width:26px;height:26px;margin:-26px 0 0 -4px;border-radius:13px 13px 13px 2px;background:{{ p.bg }};color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25);cursor:pointer;border:2px solid #fff;z-index:1000">{{ p.n }}</div>
          </sc-for>
          <sc-if value="{{ hasPopover }}" hint-placeholder-val="{{ false }}">
            <div onMouseDown="{{ stop }}" style="position:absolute;left:{{ popLeft }}px;top:{{ popTop }}px;width:260px;background:#fff;border-radius:10px;box-shadow:0 8px 28px rgba(28,27,25,.22);padding:12px;z-index:1001;transform:scale({{ popScale }});transform-origin:top left">
              <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#0b4ea2;margin-bottom:6px">{{ popTarget }}</div>
              <sc-if value="{{ popIsOpen }}" hint-placeholder-val="{{ true }}">
                <textarea value="{{ popDraft }}" onChange="{{ onPopDraft }}" onKeyDown="{{ onPopKey }}" placeholder="What should change here?" rows="2" style="width:100%;padding:8px;border:1px solid #cfcdc6;border-radius:6px;font-size:13px;resize:none;outline:none" style-focus="border-color:#0b4ea2"></textarea>
                <div style="display:flex;gap:6px;justify-content:flex-end;margin-top:8px">
                  <button onClick="{{ popCancel }}" style="height:28px;padding:0 10px;border:none;background:transparent;color:#6b6a66;font-size:12px;cursor:pointer">Cancel</button>
                  <button onClick="{{ popSubmit }}" style="height:28px;padding:0 12px;border:none;border-radius:6px;background:#0b4ea2;color:#fff;font-size:12px;font-weight:500;cursor:pointer">Apply</button>
                </div>
              </sc-if>
              <sc-if value="{{ popIsDone }}" hint-placeholder-val="{{ false }}">
                <div style="font-size:13px;line-height:1.4;white-space:pre-wrap">{{ popDraft }}</div>
                <div style="font-size:12px;color:#1a7f4b;margin-top:6px">✓ {{ popReply }}</div>
                <div style="display:flex;gap:6px;justify-content:flex-end;margin-top:8px">
                  <button onClick="{{ popDelete }}" style="height:28px;padding:0 10px;border:none;background:transparent;color:#6b6a66;font-size:12px;cursor:pointer">Remove</button>
                  <button onClick="{{ popCancel }}" style="height:28px;padding:0 12px;border:1px solid #cfcdc6;border-radius:6px;background:#fff;font-size:12px;cursor:pointer">Close</button>
                </div>
              </sc-if>
            </div>
          </sc-if>
          <sc-if value="{{ hasSel }}" hint-placeholder-val="{{ false }}">
            <div onMouseDown="{{ onResizeDown }}" style="position:absolute;left:{{ selRight }}px;top:{{ selBottom }}px;width:10px;height:10px;margin:-5px;background:#fff;border:2px solid #0b4ea2;border-radius:2px;cursor:nwse-resize;z-index:999"></div>
          </sc-if>
        </div>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:12px;padding:10px 20px;border-top:1px solid #dedcd6;background:#fbfaf8;flex-shrink:0;min-height:50px;font-size:13px;flex-wrap:wrap">
        <sc-if value="{{ hasSel }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;align-items:center;gap:8px;font-weight:500"><span style="width:8px;height:8px;border-radius:2px;background:#0b4ea2;display:inline-block"></span>{{ selName }}<span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#6b6a66">{{ selId }}</span></div>
          <label style="display:flex;align-items:center;gap:6px;color:#6b6a66">Role
            <select value="{{ selRole }}" onChange="{{ onSelRole }}" style="height:30px;padding:0 6px;border:1px solid #cfcdc6;border-radius:5px;font-size:13px;background:#fff">
              <sc-for list="{{ roles }}" as="r" hint-placeholder-count="0"><option value="{{ r }}">{{ r }}</option></sc-for>
            </select></label>
          <label style="display:flex;align-items:center;gap:6px;color:#6b6a66">Anchor
            <select value="{{ selAnchor }}" onChange="{{ onSelAnchor }}" style="height:30px;padding:0 6px;border:1px solid #cfcdc6;border-radius:5px;font-size:13px;background:#fff">
              <sc-for list="{{ anchors }}" as="a" hint-placeholder-count="0"><option value="{{ a }}">{{ a }}</option></sc-for>
            </select></label>
          <sc-if value="{{ selIsText }}" hint-placeholder-val="{{ false }}">
            <input value="{{ selText }}" onChange="{{ onSelText }}" style="flex:1;min-width:160px;height:30px;padding:0 10px;border:1px solid #cfcdc6;border-radius:5px;font-size:13px;background:#fff">
            <label style="display:flex;align-items:center;gap:6px;color:#6b6a66">Size <input type="number" value="{{ selFs }}" onChange="{{ onSelFs }}" style="width:58px;height:30px;padding:0 8px;border:1px solid #cfcdc6;border-radius:5px;font-size:13px;background:#fff"></label>
            <label style="display:flex;align-items:center;gap:6px;color:#6b6a66">Min <input type="number" value="{{ selMinFs }}" onChange="{{ onSelMinFs }}" title="minFontSize for adaptation" style="width:52px;height:30px;padding:0 8px;border:1px solid #cfcdc6;border-radius:5px;font-size:13px;background:#fff"></label>
          </sc-if>
          <sc-if value="{{ selHasColor }}" hint-placeholder-val="{{ false }}">
            <label style="display:flex;align-items:center;gap:6px;color:#6b6a66">{{ selColorLabel }} <input type="color" value="{{ selColor }}" onChange="{{ onSelColor }}" style="width:30px;height:30px;padding:0;border:1px solid #cfcdc6;border-radius:5px;background:#fff"></label>
          </sc-if>
          <sc-if value="{{ selIsImage }}" hint-placeholder-val="{{ false }}">
            <label style="height:30px;padding:0 12px;border:1px solid #cfcdc6;border-radius:5px;font-size:13px;display:flex;align-items:center;cursor:pointer;background:#fff">Replace image<input type="file" accept="image/*" onChange="{{ onSelImage }}" style="display:none"></label>
          </sc-if>
          <div style="flex:1"></div>
          <button onClick="{{ toggleSel }}" style="height:30px;padding:0 10px;border:1px solid #cfcdc6;border-radius:5px;background:#fff;font-size:13px;cursor:pointer">{{ selVisLabel }}</button>
          <button onClick="{{ clearSel }}" style="height:30px;padding:0 10px;border:none;background:transparent;color:#6b6a66;font-size:13px;cursor:pointer">Done</button>
        </sc-if>
        <sc-if value="{{ noSel }}" hint-placeholder-val="{{ true }}">
          <div style="color:#6b6a66">{{ hintText }}</div>
        </sc-if>
      </div>
    </div>

    <div style="width:360px;flex-shrink:0;display:flex;flex-direction:column;border-left:1px solid #dedcd6;background:#fbfaf8;min-height:0">
      <div style="display:flex;align-items:center;padding:12px 18px 8px;font-weight:600;font-size:13px">Layers<div style="flex:1"></div><span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#6b6a66;font-weight:400">{{ layerCount }}</span></div>
      <div style="max-height:36%;overflow-y:auto;padding:0 10px 10px;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid #dedcd6;flex-shrink:0">
        <sc-for list="{{ layers }}" as="l" hint-placeholder-count="0">
          <div onClick="{{ l.pick }}" style="display:flex;align-items:center;gap:8px;height:30px;padding:0 8px 0 {{ l.indent }}px;border-radius:5px;background:{{ l.bg }};cursor:pointer;font-size:12px;opacity:{{ l.op }}" style-hover="background:#eceae4">
            <span style="width:14px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#6b6a66;text-align:center">{{ l.glyph }}</span>
            <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ l.name }}</span>
            <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;padding:1px 6px;border-radius:9px;background:{{ l.roleBg }};color:{{ l.roleFg }}">{{ l.role }}</span>
            <button onClick="{{ l.toggle }}" title="Show / hide" style="width:22px;height:22px;border:none;background:transparent;cursor:pointer;color:#6b6a66;font-size:12px;padding:0">{{ l.eye }}</button>
          </div>
        </sc-for>
      </div>
      <div style="padding:12px 18px 6px;font-weight:600;font-size:13px">Assistant</div>
      <div ref="{{ logRef }}" style="flex:1;min-height:0;overflow-y:auto;padding:6px 18px 12px;display:flex;flex-direction:column;gap:10px">
        <sc-for list="{{ msgs }}" as="m" hint-placeholder-count="1">
          <div style="align-self:{{ m.side }};max-width:88%;padding:9px 12px;border-radius:10px;font-size:13px;line-height:1.45;background:{{ m.bg }};color:{{ m.fg }};white-space:pre-wrap;text-wrap:pretty">{{ m.text }}</div>
        </sc-for>
        <sc-if value="{{ busy }}" hint-placeholder-val="{{ false }}">
          <div style="align-self:flex-start;padding:10px 12px;border-radius:10px;background:#eceae4;display:flex;gap:4px">
            <span style="width:5px;height:5px;border-radius:50%;background:#1c1b19;animation:blink 1.2s infinite"></span>
            <span style="width:5px;height:5px;border-radius:50%;background:#1c1b19;animation:blink 1.2s .2s infinite"></span>
            <span style="width:5px;height:5px;border-radius:50%;background:#1c1b19;animation:blink 1.2s .4s infinite"></span>
          </div>
        </sc-if>
      </div>
      <div style="padding:8px 18px 0;display:flex;flex-wrap:wrap;gap:6px">
        <sc-for list="{{ chips }}" as="c" hint-placeholder-count="3">
          <button onClick="{{ c.go }}" style="height:26px;padding:0 10px;border:1px solid #dedcd6;border-radius:13px;background:#fff;font-size:12px;color:#3d3c39;cursor:pointer;white-space:nowrap" style-hover="border-color:#1c1b19">{{ c.label }}</button>
        </sc-for>
      </div>
      <div style="padding:12px 18px 16px">
        <sc-if value="{{ hasSel }}" hint-placeholder-val="{{ false }}">
          <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#0b4ea2;margin-bottom:6px">editing: {{ selName }}</div>
        </sc-if>
        <div style="display:flex;gap:6px">
          <input value="{{ draft }}" onChange="{{ onDraft }}" onKeyDown="{{ onKey }}" placeholder="{{ placeholder }}" style="flex:1;height:38px;padding:0 12px;border:1px solid #cfcdc6;border-radius:8px;font-size:13px;background:#fff;outline:none" style-focus="border-color:#0b4ea2">
          <button onClick="{{ send }}" style="height:38px;padding:0 14px;border:none;border-radius:8px;background:#0b4ea2;color:#fff;font-size:13px;font-weight:500;cursor:pointer">Send</button>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const STD_SIZES=[[1200,628],[1080,1080],[1080,1920],[300,250]];
const ROLE_COLORS={background:'#6b6a66',logo:'#0b4ea2',headline:'#1c1b19',subhead:'#3d3c39',offer:'#8a4b00',cta:'#e8541e',product:'#1a7f4b',disclaimer:'#6b6a66',body:'#3d3c39',image:'#1a7f4b',shape:'#6b6a66',decoration:'#6b6a66'};
const hex=c=>{ if(!c) return '#000000'; if(c[0]==='#') return c.length===4?'#'+[...c.slice(1)].map(x=>x+x).join(''):c.slice(0,7); const m=c.match(/\d+/g); return m?'#'+m.slice(0,3).map(n=>(+n).toString(16).padStart(2,'0')).join(''):'#000000'; };
const weightOf=s=>{ s=(s||'').toLowerCase(); if(/thin|hairline/.test(s)) return 100; if(/extralight|ultralight/.test(s)) return 200; if(/light/.test(s)) return 300; if(/medium/.test(s)) return 500; if(/semibold|demibold/.test(s)) return 600; if(/extrabold|ultrabold/.test(s)) return 800; if(/black|heavy/.test(s)) return 900; if(/bold/.test(s)) return 700; return 400; };
const toDataUrl=async url=>{ if(!url||url.startsWith('data:')) return url; const b=await (await fetch(url)).blob(); return new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(b); }); };
const key=(w,h)=>w+'x'+h;

class Component extends DCLogic {
  state={ base:null, scenes:{}, sizeKey:'820x320', sizes:[[820,320]], assets:{}, fileName:'', sel:null, hover:null, zoom:1, zoomMode:'fit', undo:[], redo:[], mode:'select', pins:[], activePin:null, popDraft:'', draft:'', busy:false, dropping:false,
    msgs:[{role:'a',text:'Open a scene bundle exported from Illustrator (folder or .zip), or drop one here. Click any element to edit it, or tell me what to change.'}] };
  stageRef=React.createRef(); artRef=React.createRef(); logRef=React.createRef(); drag=null; fontsTried=new Set();

  async componentDidMount(){ this.S=await import('./scene.js'); this.ro=new ResizeObserver(()=>this.fit()); this.fit(); window.addEventListener('load',()=>this.fit());
    window.addEventListener('resize',this.fit); window.addEventListener('mousemove',this.onMove); window.addEventListener('mouseup',this.onUp); window.addEventListener('keydown',this.onKeyGlobal);
    try{ const raw=await (await fetch('samples/demo/scene.json')).json(); const assets={}; for(const a of raw.assets||[]) assets[a.path]='samples/demo/'+a.path; this.openScene(raw,assets,'demo · federal-bank-kv-scene',true); }catch(e){} }
  componentWillUnmount(){ this.ro?.disconnect(); window.removeEventListener('resize',this.fit); window.removeEventListener('mousemove',this.onMove); window.removeEventListener('mouseup',this.onUp); window.removeEventListener('keydown',this.onKeyGlobal); }
  componentDidUpdate(_,ps){ if(!ps) return; if(ps.sizeKey!==this.state.sizeKey) this.fit(); if(ps.msgs!==this.state.msgs&&this.logRef.current) this.logRef.current.scrollTop=1e9; }
  scene(){ return this.state.scenes[this.state.sizeKey]; }
  size(){ return this.state.sizeKey.split('x').map(Number); }
  fit=(tries=0)=>{ if(this.state.zoomMode!=='fit') return; const st=this.stageRef.current;
    if(!st||st.clientWidth<100||st.clientHeight<100){ if(tries<40) requestAnimationFrame(()=>this.fit(tries+1)); return; }
    if(this.ro&&!this.observed){ this.observed=true; this.ro.observe(st); }
    const [w,h]=this.size(); const z=Math.max(.1,Math.min((st.clientWidth-48)/w,(st.clientHeight-48)/h,1.6));
    this.setState(s=>Math.abs(z-s.zoom)>.001?{zoom:z}:null); };
